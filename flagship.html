<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08080A" />
    <title>Culture Peptides — Research Peptides, Documented</title>
    <meta
      name="description"
      content="Search research peptides by sequence, CAS or catalog number. Every lot published with a third-party certificate of analysis, chromatogram and mass spectrum. For laboratory research use only."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Are Culture Peptides products intended for human use?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. All products are supplied strictly for in-vitro laboratory research use only. They are not drugs, dietary supplements, foods or cosmetics, and are not for human or veterinary consumption."
            }
          },
          {
            "@type": "Question",
            "name": "How do I verify a vial is genuine?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Each vial cap carries a scratch-off panel concealing a unique ten-character code. Enter that code in the authenticity checker to confirm the vial was released by us and to see its lot record."
            }
          },
          {
            "@type": "Question",
            "name": "Why can an HPLC purity result read higher than 100%?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Purity is measured against a reference standard. If a lot is purer than the standard it is compared to, the calculated result can exceed 100%. A value such as 101.4% describes the reference standard, not an error in the lot."
            }
          },
          {
            "@type": "Question",
            "name": "Which laboratory performs the testing?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "An independent ISO/IEC 17025-accredited analytical laboratory, named on every certificate with its own contact details so buyers can verify results directly."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/v3/main.tsx"></script>
  </body>
